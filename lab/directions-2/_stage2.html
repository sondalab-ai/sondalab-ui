<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../packages/ui-kit/assets/favicon.svg">
<title>Direction stage</title>
<script>
  /* One screen, one theme, one accent per document: the kit's --slc-* role
     vars resolve at :root, so each theme gets its own iframe.
     Params: dir=kit|lumen  theme=dark|light|high-contrast
             accent=amber|indigo|cyan  screen=ide|settings|data|hero  fit=1 (scale to width) */
  (function () {
    var p = new URLSearchParams(location.search);
    var dir = p.get("dir") || "kit", theme = p.get("theme") || "dark", accent = p.get("accent") || "amber", screen = p.get("screen") || "ide";
    var h = document.documentElement;
    h.setAttribute("data-sl-theme", theme);
    h.setAttribute("data-dir", dir);
    h.setAttribute("data-accent", accent);
    h.setAttribute("data-screen", screen);
    if (p.get("fit") !== "0") h.setAttribute("data-fit", "");
    // accent-registry.json values; indigo's steps are hand-tuned, cyan derives
    var A = {
      indigo: { light: ["#5b6cff", "#4858ee", "#3645d4", "#eef0ff"], dark: ["#8b96ff", "#a3acff", "#6b78f0", "#1c1f3a"] },
      cyan: { light: ["#0e9c84"], dark: ["#2ee6c0"] },
    };
    if (A[accent] && theme !== "high-contrast") {
      var v = A[accent][theme];
      h.style.setProperty("--sl-accent-default", v[0]);
      // dark pins the ring to amber as a literal; light already derives it from the accent
      if (theme === "dark") h.style.setProperty("--sl-focus-ring", v[0]);
      if (v[1]) { h.style.setProperty("--sl-accent-hover", v[1]); h.style.setProperty("--sl-accent-active", v[2]); h.style.setProperty("--sl-accent-subtle", v[3]); }
    }
    var bust = "?v=" + Date.now();
    document.write('<link rel="stylesheet" href="_stage2.css' + bust + '">');
    if (dir !== "kit") document.write('<link rel="stylesheet" href="dir-' + dir + '.css' + bust + '">');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../packages/ui-kit/fonts.css">
<link rel="stylesheet" href="../../packages/ui-kit/tokens.css">
<link rel="stylesheet" href="../../packages/ui-kit/themes/light.css">
<link rel="stylesheet" href="../../packages/ui-kit/themes/dark.css">
<link rel="stylesheet" href="../../packages/ui-kit/themes/high-contrast.css">
<link rel="stylesheet" href="../../packages/ui-kit/components.css">
<script>
  /* order matters: the stage sheet and the direction sheet come after components.css */
  (function () { document.querySelectorAll('link[href^="_stage2.css"], link[href^="dir-"]').forEach(function (l) { document.head.appendChild(l); }); })();
</script>
</head>
<body>
<div id="stage"></div>
<script>document.write('<script src="_screens.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
