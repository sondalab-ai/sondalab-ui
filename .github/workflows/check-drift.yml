name: Check token generation drift

# Regenerates the CSS kit and Python palette from sondalab.tokens.json and fails
# if the committed outputs differ. Guards against hand-edited or stale generated
# files shipping to npm / PyPI.

on:
  pull_request:
    paths:
      - "sondalab.tokens.json"
      - "scripts/**"
      - "packages/**"
      - ".github/workflows/check-drift.yml"
  push:
    branches: [main]

permissions:
  contents: read   # checkout of a private repo (a permissions block defaults the rest to none)

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate tokens
        run: npm run gen:tokens

      - name: Fail if committed outputs drift from regeneration
        # `git diff` alone misses a generated file that was never committed
        # (themes/products.css and neutrals.json arrived in 0.29), so any
        # untracked or modified path under packages/ fails the check too.
        run: |
          git diff --exit-code -- packages/
          drift="$(git status --porcelain --untracked-files=all -- packages/)"
          if [ -n "$drift" ]; then
            echo "Generated output not committed:"
            echo "$drift"
            exit 1
          fi

      - name: Tests
        # The suite also holds products.css and neutrals.json to a fresh
        # build of the ladder (scripts/neutrals-ladder.test.mjs). It needs no
        # install: node:test and the repo's own files only.
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Python palette tests
        # 3.9 is the floor in packages/palette-py/pyproject.toml.
        run: |
          pip install -e packages/palette-py pytest
          python -m pytest packages/palette-py/tests
